name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The default PyTorch wheel pulls several GB of CUDA libraries; the MIL
      # tests only need the CPU build.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies and the package
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Tests
        run: pytest tests/ -q

      # Runs even when tests fail, so both results show up in one run.
      - name: Lint
        if: success() || failure()
        run: ruff check src/
